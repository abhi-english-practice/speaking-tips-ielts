<title>IELTS Speaking Tips | Abhi-Uyen English Course</title>
<style>
:root{--ink:#20211f;--coal:#212322;--paper:#fcf9f0;--white:#fffcf7;--wine:#84253a;--wine2:#a53b4b;--olive:#d5f378;--line:#202120;--muted:#746b65;--coffee:#755039;--beige:#f4eadc;--shadow:7px 8px 0 #131514}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--coal);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-width:300px}
button{font:inherit;cursor:pointer}

.topbar{padding:15px clamp(16px,4vw,54px);display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid #555b54;background:#232524;color:#f7f5e9}

.brandicon{display:grid;place-items:center;height:37px;width:37px;background:var(--olive);color:#1e2616;border-radius:10px;border:2px solid #10160d;box-shadow:3px 3px 0 #121411;font-family:Georgia,serif;font-size:22px;font-weight:900}
.brand small{display:block;margin-top:3px;font-size:10px;color:#c6c8bf;letter-spacing:1.25px;text-transform:uppercase;font-weight:700}
.topflag{padding:8px 11px;border:1px solid #64685f;border-radius:20px;color:#e5e3d9;font-size:11px;white-space:nowrap;letter-spacing:1px}
.outer{max-width:1430px;margin:auto;padding:29px 28px 44px}
.hero{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:26px;color:#fffbef}
.kicker{margin:0 0 8px;color:var(--olive);font-size:11px;letter-spacing:2px;font-weight:900;text-transform:uppercase}
h1{margin:0;line-height:1.03;font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,4.25vw,54px);font-weight:750;letter-spacing:-1.7px}
.hero p:last-child{margin:12px 0 0;color:#d4d4ca;max-width:680px;line-height:1.55;font-size:14px}
.counter{flex:0 0 auto;text-align:right;color:#fffdf4}
.counter strong{display:block;font-family:Georgia,serif;font-size:36px;line-height:1}
.counter span{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#c5c8bd}
.layout{display:grid;grid-template-columns:258px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{background:#f6f1e8;border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:17px;position:sticky;top:15px}
.sidebar-title{font-size:11px;letter-spacing:1.65px;font-weight:900;color:#655d56;text-transform:uppercase;margin:3px 0 13px}
.topic-list{display:grid;gap:5px}
.topic-jump{border:1px solid transparent;background:transparent;display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-radius:8px;padding:11px 8px;font-size:13px;line-height:1.35;color:#443f3b;transition:background .18s,border-color .18s}
.topic-jump:hover{background:#ece5d9}
.topic-jump[aria-current="true"]{background:var(--olive);color:#151b11;border-color:#687344;font-weight:bold}
.topic-num{flex:0 0 27px;font-family:Georgia,serif;font-size:16px;font-weight:bold;color:var(--wine)}
.topic-jump[aria-current="true"] .topic-num{color:#202522}
.side-bottom{border-top:1px solid #ddd2c1;margin-top:15px;padding-top:13px;font-size:12px;line-height:1.55;color:#6b655d}
.pillmark{display:inline-block;padding:4px 9px;background:#f0dfd8;color:var(--wine);border:1px solid #e5c6b9;border-radius:50px;font-weight:700;font-size:11px}
.reader{background:var(--paper);border:2px solid #111514;box-shadow:var(--shadow);border-radius:16px;overflow:hidden;min-width:0}
.reader-top{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:14px 22px;background:#f1e9dd;border-bottom:2px solid #21231e}
.reader-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{font-size:11px;font-weight:900;letter-spacing:1.2px;background:#fbf8f0;border:1px solid #b7ac9e;padding:9px 12px;border-radius:7px}
.tab.selected{background:var(--olive);border-color:#232823}
.settings{display:flex;flex-wrap:wrap;gap:7px}
.switch{background:var(--white);border:1px solid #c9bbab;border-radius:6px;padding:8px 10px;font-weight:800;font-size:11px;display:inline-flex;gap:8px;align-items:center;min-height:35px}
.switch.on{background:#e7efcf;border-color:#748550}
.dot{height:9px;width:9px;border:2px solid #85837c;border-radius:100%;display:inline-block}
.switch.on .dot{background:#396226;border-color:#396226}
.content{padding:clamp(20px,4.4vw,48px) clamp(18px,4.3vw,53px) 32px;background:radial-gradient(circle at 92% 2%, #faecdb 0, transparent 44%), var(--paper)}
.topic-content[hidden]{display:none!important}
.section-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}

.unitline b{color:var(--wine)}
.audio-wait{font-size:10.5px;font-weight:800;color:#76685d;border:1px dashed #ad998e;background:#fffaf1;border-radius:20px;padding:7px 10px;white-space:nowrap}
.titlebox{display:flex;gap:18px;align-items:start;border-bottom:2px solid #dbc6bb;padding-bottom:21px;margin-bottom:25px}
.big-num{font-family:Georgia,serif;color:var(--wine);font-size:54px;font-weight:750;line-height:1;min-width:60px;letter-spacing:-3px}
h2{font-family:Georgia,'Times New Roman',serif;color:var(--wine);font-style:italic;font-size:clamp(24px,3.3vw,38px);line-height:1.23;letter-spacing:-.7px;margin:0}
.scriptlabel{display:flex;align-items:center;gap:10px;letter-spacing:1.8px;font-size:10px;font-weight:900;color:#7f6c60;text-transform:uppercase;margin-bottom:14px}
.scriptlabel::after{content:'';height:1px;flex:1;background:#dfd0be}
.script{font-family:Georgia,'Times New Roman',serif;font-size:clamp(18px,2.1vw,23px);line-height:1.87;letter-spacing:.025px;color:#25221f;white-space:normal}
.script p{margin:0 0 21px}
.inline-term{display:inline;border:0;border-bottom:2px dotted #b96b6b;padding:0 1px;color:var(--wine);background:none;font-family:inherit;font-size:inherit;line-height:inherit;font-style:italic;font-weight:700;border-radius:2px;text-align:left;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.inline-term:hover,.inline-term.picked{color:#341614;background:#f7e6ac;border-bottom-color:#9e4344}
body.no-highlights .inline-term{color:inherit;border:0;background:none;font-style:inherit;font-weight:inherit;pointer-events:none}
.master,.sensory{border:1px solid #ddc9ae;background:#fff5db;border-radius:9px;padding:16px 19px;margin:23px 0 14px}
.master h3,.sensory h3{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--wine);margin:0 0 8px;font-weight:900}
.master strong{display:block;font-family:Georgia,serif;font-size:20px;line-height:1.5;font-style:italic;text-align:center;color:#51252d}
.sensory-list{display:grid;gap:10px;font-family:Georgia,serif;font-size:16px;line-height:1.55}
.sensory-list b{color:var(--wine)}
.notes{margin-top:36px;border-top:2px solid #212321;padding-top:22px}
.notes-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}
.notes-head h3{margin:0;font-family:Georgia,serif;font-size:26px;color:#2b2926}
.notes-head small{display:block;letter-spacing:1.35px;font-size:10px;color:#6f6861;font-weight:850;margin-bottom:4px}
.notes-head .count{font-size:11px;color:#7a675d;font-weight:750}
.note-list{border:1px solid #d5c5b8;border-radius:10px;overflow:hidden}
.note-item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 17px;border-bottom:1px solid #e2d4c7;background:#fffefa;scroll-margin-top:22px}
.note-item:nth-child(even){background:#fbf5ea}
.note-item:last-child{border-bottom:0}
.note-item.selected-note{background:#f5f5d3;box-shadow:inset 5px 0 0 #88ab4b}
.note-number{font:700 19px Georgia,serif;color:var(--wine);padding-top:2px}
.note-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:10px}
.note-en{font:700 15px/1.5 Georgia,serif;color:var(--wine);max-width:100%;overflow-wrap:anywhere}
.cat{font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#716151;border:1px solid #d7c9bb;border-radius:50px;padding:3px 8px;white-space:nowrap;background:#fcf8ee}
.usage{margin:5px 0 0;font-size:13px;color:#4d473e;line-height:1.5}
.usage span{font-weight:900;color:#3b4030}
.vi-box{margin-top:10px;padding:11px 13px;background:#f0e5d8;border-left:3px solid #8a543c;border-radius:4px;color:var(--coffee);font-size:13px;line-height:1.65}
.vi-box strong{font-weight:800}
.vi-box .expl{display:block;margin-top:4px}
.note-open{margin-top:10px;background:transparent;border:1px solid #cbbdb0;border-radius:5px;font-size:11px;padding:6px 9px;color:#624a3e;font-weight:850}
.note-open:hover{background:#efe3d5}
.note-item.expanded .note-open{background:#ead9cb}
.meta-inline{font-size:11px;color:#6a6259;line-height:1.5;margin:15px 0 0}
.movebar{background:#f0e8dc;padding:17px 24px;border-top:2px solid #161817;display:flex;justify-content:space-between;align-items:center;gap:10px}
.navbtn{border:1.5px solid #262821;background:#fffcf5;padding:11px 16px;font-size:12px;font-weight:850;border-radius:7px;min-width:112px;box-shadow:3px 3px 0 #333}
.navbtn:hover:not(:disabled){background:var(--olive)}
.navbtn:disabled{opacity:.35;cursor:default;box-shadow:none}
.progress{text-align:center;line-height:1.55;font-size:12px;font-weight:850;color:#696057}
.progress small{display:block;font-size:10px;letter-spacing:1px;color:#8c7c6f;font-weight:800}
.footer{color:#d2d7cd;text-align:center;font-size:12px;padding:24px 12px 2px;line-height:1.6}
.footer strong{color:#f4f1df}
.mobile-picker{display:none}
@media(max-width:950px){.outer{padding:20px 16px 35px}.layout{display:block}.sidebar{display:none}.mobile-picker{display:flex;align-items:center;gap:10px;color:#faf5ed;margin:0 0 16px;font-size:13px;font-weight:800}.mobile-picker select{flex:1;min-width:0;border:2px solid #121514;border-radius:8px;padding:11px 12px;background:#f7f1e6;color:#332c26;font-weight:800;font-size:13px}.hero{align-items:start}.counter strong{font-size:30px}}
@media(max-width:620px){.topbar{padding:12px 15px}.topflag{display:none}.outer{padding:16px 11px 22px}.hero{margin-bottom:18px;gap:10px}.hero p:last-child{font-size:12.5px}.counter{display:none}.reader-top{padding:10px 12px}.content{padding:21px 16px 25px}.titlebox{gap:11px}.big-num{font-size:39px;min-width:43px}h2{font-size:26px}.script{font-size:19px;line-height:1.75}.section-top{flex-wrap:wrap}.notes-head h3{font-size:23px}.note-item{grid-template-columns:25px minmax(0,1fr);gap:8px;padding:13px 10px}.note-en{font-size:15px}.cat{font-size:8.5px}.movebar{padding:12px 12px}.navbtn{min-width:95px;padding:10px 8px;font-size:11px;box-shadow:2px 2px 0 #333}.progress{font-size:11px}.master strong{font-size:17px}.footer{padding-top:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{body{background:white}.topbar,.hero,.sidebar,.mobile-picker,.reader-top,.movebar,.audio-wait,.note-open,.footer .small,.meta-inline{display:none!important}.outer{padding:0;margin:0;max-width:none}.layout{display:block}.reader{border:0;box-shadow:none;border-radius:0}.content{padding:0;background:white}.topic-content[hidden]{display:block!important}.topic-content{page-break-after:always;margin:20px 12px}.notes{margin-top:20px}.note-item{break-inside:avoid}.vi-box{display:block!important}.inline-term{color:#84253a!important}.script{font-size:15px;line-height:1.5}h2{font-size:24px}.footer{display:block;color:#333}}

/* Integrated single-track per-topic player: active topic clip only. */
.audio-panel{margin:0 0 24px;border:1.5px solid #c9b8a8;background:#fffcf4;padding:14px 16px 13px;border-radius:10px;box-shadow:3px 3px 0 #e6d9c5}
.audio-upper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.audio-label{font-size:10px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:#835038}
.audio-state{font-size:11px;color:#6b655b;font-weight:700}
.audio-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.audio-btn{border:1.5px solid #2b3025;border-radius:7px;background:#fcf9ee;font-size:12px;font-weight:800;min-width:81px;padding:10px 11px;min-height:39px;color:#20231d}
.audio-btn.primary{background:#d5f378}
.audio-btn:hover{background:#e8eece}
.audio-btn:disabled{opacity:.45;cursor:default}
.audio-progress{width:100%;accent-color:#81283c;height:5px;cursor:pointer;margin:12px 0 5px;touch-action:pan-x}
.audio-progress:disabled{cursor:default;opacity:.45}
.audio-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#625c53;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.audio-speed{color:#302b23;background:#fff;border:1px solid #bbaea1;border-radius:5px;font-size:12px;padding:5px 8px}
.audio-speed:focus-visible,.audio-progress:focus-visible{outline:3px solid #3878f4;outline-offset:3px}
@media(max-width:620px){.audio-panel{padding:12px 11px}.audio-btn{flex:1;min-width:85px}.audio-actions{width:100%}.audio-upper{margin-bottom:9px}}

/* v2.1: Natural text wrapping, clean baselines and complete Vietnamese paragraphs */
.script{font-family:Georgia,'Times New Roman',serif;text-align:left;letter-spacing:0;word-spacing:normal;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:none;font-size:clamp(18px,1.85vw,22px);line-height:1.77}
.script-pair{padding:0;margin:0 0 20px;border-radius:9px;transition:background-color .16s ease}
.script-pair:last-child{margin-bottom:0}
.script .text-paragraph{margin:0;line-height:inherit;text-align:left;overflow-wrap:normal}
.inline-term{display:inline!important;white-space:normal!important;word-break:normal!important;overflow-wrap:normal!important;line-height:inherit!important;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer;border:0;border-bottom:1.5px dotted #a84454;padding:0 .5px!important;margin:0!important;font:italic 700 1em/1.77 Georgia,'Times New Roman',serif;vertical-align:baseline;box-shadow:none;outline-offset:2px}
.inline-term:focus-visible{outline:2px solid #527b00;background:#fff0aa}
.full-vi{display:none;margin:13px 0 0!important;padding:14px 17px;border-left:3px solid #9c7154;border-radius:0 8px 8px 0;background:#f3e9df;color:#604a38;font:400 15px/1.82 Arial,Helvetica,sans-serif;letter-spacing:0;text-align:left;white-space:normal;overflow-wrap:break-word}
body.vi-on .full-vi{display:block}
.topic-content.audio-speaking .script{border-left:4px solid #80a93a;margin-left:-13px;padding:14px 15px 14px 13px;background:#f0f7da;border-radius:7px;transition:background .18s ease}
.topic-content.audio-speaking .scriptlabel{color:#44631f}
.topic-content.audio-speaking .audio-panel{border-color:#7ea935;background:#f8ffe9}
.topic-content.audio-speaking .audio-label::before{content:'●';color:#5b9521;margin-right:7px}
@media(max-width:620px){
 .script{font-size:18px;line-height:1.69;letter-spacing:0;text-align:left}
 .inline-term{line-height:1.69!important}
 .script-pair{margin-bottom:17px}

 .topic-content.audio-speaking .script{margin-left:-7px;padding:10px 8px 10px 10px}
 .content{padding-left:18px;padding-right:18px}
}


.audio-unavailable{background:#fcf5e9;border-style:dashed}
.audio-unavailable .audio-state{color:#875c35}
.audio-missing{font-size:13px;color:#755c46;line-height:1.5;margin:4px 0 0}
</style>

<script id="speaking-data" type="application/json">[{"id":1,"title":"Do you like cooking at home?","paragraphs":["Well, to be honest, it really depends on how busy I am. If I have lots of free time, I love nothing more than to cook up mouthwatering cuisine. However, if I have a tight schedule, then I prefer to just order a takeout."],"terms":[{"term":"to be honest","vi":"thành thật mà nói","category":"Discourse marker","usage":"Use it to introduce a sincere opinion.","explain":"Dùng ở đầu lời đáp để đưa ra ý kiến một cách tự nhiên."},{"term":"depend on how busy I am","vi":"phụ thuộc vào việc tôi bận đến mức nào","category":"Grammar pattern","usage":"depend on + noun / how-clause","explain":"Sau depend on có thể là danh từ hoặc mệnh đề bắt đầu bằng how."},{"term":"have lots of free time","vi":"có nhiều thời gian rảnh","category":"Collocation","usage":"have + free time; also: have plenty of free time","explain":"Free time là thời gian không bận học hoặc làm việc."},{"term":"love nothing more than to ...","vi":"không thích gì hơn việc ...; cực kỳ thích ...","category":"Speaking pattern","usage":"love nothing more than to + base verb","explain":"Diễn tả rất thích làm một việc, nhấn mạnh cảm xúc."},{"term":"cook up mouthwatering cuisine","vi":"chế biến những món ăn hấp dẫn, ngon miệng","category":"Useful chunk","usage":"cook up + a dish / a meal","explain":"Cook up mang sắc thái thân mật; “cook up a mouthwatering meal” tự nhiên hơn khi nói về một món ăn."},{"term":"have a tight schedule","vi":"có lịch trình dày đặc, bận rộn","category":"Collocation","usage":"have a tight schedule","explain":"Tight schedule là lịch trình dày đặc, có ít thời gian trống."},{"term":"order a takeout","vi":"đặt món ăn mang về","category":"Useful chunk","usage":"order takeout (US) / order takeaway (UK)","explain":"Giữ nguyên “order a takeout” trong bài gốc; khi nói thường dùng “order takeout” hoặc “get takeaway”."}],"extra":null,"highlight":[["to be honest",0],["depends on how busy I am",1],["have lots of free time",2],["love nothing more than to",3],["cook up mouthwatering cuisine",4],["a tight schedule",5],["order a takeout",6]],"translation":["Ừm, thành thật mà nói, điều đó thực sự phụ thuộc vào việc tôi bận đến mức nào. Nếu có nhiều thời gian rảnh, tôi không thích gì hơn việc tự nấu những món ăn thơm ngon hấp dẫn. Tuy nhiên, nếu lịch trình kín mít thì tôi thường chỉ muốn đặt đồ ăn mang về."]},{"id":2,"title":"Do you have a hobby?","paragraphs":["Yes. For me, I enjoy photography because it allows me to express my emotions and creativity. I can capture a moment in the blink of an eye. Moreover, I can explore different places such as street life and different aspects of everyday Vietnamese culture. I love to improve my skills and grab people's attention."],"terms":[{"term":"enjoy photography","vi":"yêu thích nhiếp ảnh","category":"Grammar pattern","usage":"enjoy + noun / -ing form","explain":"Enjoy có thể đi với danh từ hoặc động từ thêm -ing."},{"term":"express my emotions","vi":"bộc lộ cảm xúc của tôi","category":"Collocation","usage":"express + your emotions / feelings","explain":"Dùng khi một hoạt động giúp mình thể hiện cảm xúc."},{"term":"capture a moment","vi":"ghi lại một khoảnh khắc","category":"Collocation","usage":"capture + a moment / a memory","explain":"Capture a moment rất thường gặp khi nói về nhiếp ảnh."},{"term":"in the blink of an eye","vi":"trong chớp mắt; rất nhanh","category":"Idiom","usage":"in the blink of an eye = extremely quickly","explain":"Đây là cụm trạng ngữ, không phải tính từ (adjective)."},{"term":"explore different places","vi":"khám phá những địa điểm khác nhau","category":"Useful chunk","usage":"explore + a place / different places","explain":"Nói về đi tìm hiểu địa điểm và trải nghiệm mới."},{"term":"different aspects of everyday Vietnamese culture","vi":"những khía cạnh khác nhau của văn hóa Việt Nam thường nhật","category":"Grammar pattern","usage":"different aspects of + noun","explain":"Aspects of = các khía cạnh của một vấn đề hoặc nền văn hóa."},{"term":"grab people's attention","vi":"thu hút sự chú ý của mọi người","category":"Collocation","usage":"grab / catch / attract someone’s attention","explain":"Grab attention mang sắc thái mạnh và sinh động hơn attract attention."}],"extra":null,"highlight":[["enjoy photography",0],["express my emotions",1],["capture a moment",2],["in the blink of an eye",3],["explore different places",4],["different aspects of everyday Vietnamese culture",5],["grab people's attention",6]],"translation":["Có chứ. Riêng tôi, tôi thích nhiếp ảnh vì nó cho phép tôi thể hiện cảm xúc và khả năng sáng tạo. Tôi có thể ghi lại một khoảnh khắc chỉ trong chớp mắt. Hơn nữa, tôi có thể khám phá những địa điểm khác nhau, chẳng hạn như cuộc sống đường phố và nhiều khía cạnh của văn hóa Việt Nam thường ngày. Tôi thích cải thiện kỹ năng của mình và thu hút sự chú ý của mọi người."]},{"id":3,"title":"Who are you closest to in your family?","paragraphs":["Well, to be honest, this is a difficult one. In the past, I always had a strong bond with my handsome brother. This was due to the fact that we spent a lot of time together.","But now I truly love my stunning mum. She was always there and held my hand through the most difficult of times. To be honest, we're quite a close-knit family."],"terms":[{"term":"have a strong bond with someone","vi":"có mối quan hệ gắn bó sâu sắc với ai","category":"Collocation","usage":"have a strong bond with + person","explain":"Bond là mối liên hệ tình cảm bền chặt; trong bài dùng quá khứ had."},{"term":"due to the fact that ...","vi":"bởi vì ...; do thực tế là ...","category":"Linking pattern","usage":"due to the fact that + clause","explain":"Dùng để nêu nguyên nhân; “because” thường gọn hơn trong Speaking Part 1."},{"term":"spend a lot of time together","vi":"dành nhiều thời gian bên nhau","category":"Collocation","usage":"spend time + with somebody / doing something","explain":"Nhấn mạnh thời gian cùng trải qua với ai đó."},{"term":"always be there","vi":"luôn có mặt, luôn ở bên hỗ trợ","category":"Useful chunk","usage":"be there for somebody","explain":"“Be there for someone” thường nhấn mạnh sự hỗ trợ khi khó khăn."},{"term":"hold my hand through the most difficult of times","vi":"nắm tay, đồng hành với tôi qua những thời điểm khó khăn nhất","category":"Figurative phrase","usage":"hold someone’s hand through + a difficult period","explain":"Có thể hiểu theo nghĩa bóng: luôn đồng hành và hỗ trợ."},{"term":"a close-knit family","vi":"một gia đình gắn bó, khăng khít","category":"Collocation","usage":"a close-knit family / community","explain":"Close-knit chỉ tập thể có các mối quan hệ thân thiết, gắn bó."}],"extra":null,"highlight":[["had a strong bond with",0],["due to the fact that",1],["spent a lot of time together",2],["was always there",3],["held my hand through the most difficult of times",4],["close-knit family",5]],"translation":["Ừm, nói thật thì đây là một câu hỏi khó. Trước đây, tôi luôn có mối quan hệ vô cùng gắn bó với người anh trai đẹp trai của mình. Đó là vì chúng tôi đã dành rất nhiều thời gian bên nhau.","Nhưng bây giờ, tôi thực sự yêu thương người mẹ xinh đẹp của mình. Mẹ luôn ở bên tôi và nắm tay động viên tôi vượt qua những thời điểm khó khăn nhất. Thành thật mà nói, gia đình chúng tôi khá gắn bó, khăng khít."]},{"id":4,"title":"Describe your favorite trip","paragraphs":["Last week, I traveled to the golden, sandy beaches of Nha Trang, and I can still feel the soft, powdery white sand under my toes, as well as hear the waves crashing on the beach. It really gives me a sense of happiness and tranquility to visit that place."],"terms":[{"term":"golden, sandy beaches","vi":"những bãi biển cát vàng","category":"Descriptive phrase","usage":"golden + sandy beaches","explain":"Kết hợp tính từ về màu sắc và đặc điểm để miêu tả cảnh biển."},{"term":"soft, powdery white sand","vi":"cát trắng mềm, mịn như bột","category":"Sensory description","usage":"soft / powdery + sand","explain":"Powdery gợi cảm giác hạt cát rất mịn như bột."},{"term":"feel the ... sand under my toes","vi":"cảm nhận ... cát dưới những ngón chân","category":"Sensory pattern","usage":"feel + noun + under your toes","explain":"Diễn tả cảm giác xúc giác để làm trải nghiệm sống động."},{"term":"hear the waves crashing on the beach","vi":"nghe tiếng sóng vỗ ầm ào vào bờ","category":"Grammar pattern","usage":"hear + object + -ing: hear waves crashing","explain":"Cấu trúc hear + tân ngữ + V-ing làm nổi bật âm thanh đang diễn ra."},{"term":"a sense of happiness and tranquility","vi":"cảm giác hạnh phúc và thanh bình","category":"Collocation","usage":"a sense of + happiness / peace / tranquility","explain":"A sense of dùng để diễn tả cảm giác hoặc trạng thái trừu tượng."}],"extra":null,"highlight":[["golden, sandy beaches",0],["soft, powdery white sand",1],["under my toes",2],["hear the waves crashing on the beach",3],["a sense of happiness and tranquility",4]],"translation":["Tuần trước, tôi đã đi du lịch tới những bãi biển cát vàng ở Nha Trang, và đến giờ tôi vẫn có thể cảm nhận lớp cát trắng mềm, mịn như phấn dưới những ngón chân, cũng như nghe thấy tiếng sóng vỗ ầm ào vào bờ. Việc đến thăm nơi ấy thực sự mang lại cho tôi cảm giác hạnh phúc và thanh bình."]},{"id":5,"title":"What do you do in your daily routine?","paragraphs":["Well, I usually wake up about 7 a.m and enjoy a stunning coffee. Then I will occasionally go to the gym and try to do some yoga to improve my mental and physical health. To be honest, I rarely grab a bite to eat for breakfast because of my busy schedule. But from time to time, I like to enjoy a big and delicious lunch. I have to confess, I never ever watch movies in the evening because I prefer to read a book and study IELTS."],"terms":[{"term":"usually / occasionally / rarely","vi":"thường xuyên / thỉnh thoảng / hiếm khi","category":"Frequency adverbs","usage":"usually / occasionally / rarely + main verb","explain":"Trạng từ tần suất thường đứng trước động từ thường, sau động từ be."},{"term":"from time to time","vi":"thỉnh thoảng, đôi khi","category":"Adverbial phrase","usage":"from time to time = occasionally","explain":"Diễn tả một hành động đôi lúc diễn ra, không đều đặn."},{"term":"never ever","vi":"không bao giờ (nhấn mạnh)","category":"Emphatic phrase","usage":"never ever + verb","explain":"Cách nhấn mạnh “never”, thường gặp trong giao tiếp thân mật."},{"term":"go to the gym","vi":"đi đến phòng tập thể hình","category":"Collocation","usage":"go to the gym","explain":"Cụm rất tự nhiên để nói về thói quen tập thể dục."},{"term":"improve my mental and physical health","vi":"cải thiện sức khỏe tinh thần và thể chất","category":"Collocation","usage":"improve + mental and physical health","explain":"Có thể dùng khi giải thích lợi ích của yoga hoặc thể thao."},{"term":"grab a bite to eat","vi":"ăn nhẹ, ăn nhanh cho đỡ đói","category":"Idiom","usage":"grab a bite to eat","explain":"Chỉ ăn nhanh hoặc ăn một chút khi không có nhiều thời gian."},{"term":"because of my busy schedule","vi":"vì lịch trình bận rộn của tôi","category":"Grammar pattern","usage":"because of + noun phrase; because + clause","explain":"Because of đi với cụm danh từ, không trực tiếp đi với một mệnh đề đầy đủ."},{"term":"I have to confess","vi":"tôi phải thú nhận rằng","category":"Discourse marker","usage":"I have to confess (that) + clause","explain":"Dùng để thú nhận một thói quen hoặc quan điểm cá nhân."}],"extra":null,"highlight":[["usually",0],["occasionally",0],["rarely",0],["from time to time",1],["never ever",2],["go to the gym",3],["improve my mental and physical health",4],["grab a bite to eat",5],["because of my busy schedule",6],["I have to confess",7]],"translation":["Ừm, tôi thường thức dậy vào khoảng bảy giờ sáng và thưởng thức một ly cà phê tuyệt vời. Sau đó, thỉnh thoảng tôi đến phòng tập và cố gắng tập yoga để cải thiện sức khỏe tinh thần lẫn thể chất. Thành thật mà nói, tôi hiếm khi ăn chút gì vào bữa sáng vì lịch trình bận rộn. Nhưng đôi khi, tôi thích thưởng thức một bữa trưa thịnh soạn, ngon miệng. Tôi phải thú nhận rằng tôi chẳng bao giờ xem phim vào buổi tối vì tôi thích đọc sách và học IELTS hơn."]},{"id":6,"title":"Describe a place you go to relax","paragraphs":["I'd love nothing more than to visit my local stunning coffee shop because it has a vibrant atmosphere and it's really beautiful.","Whenever I think of Highland Coffee, I immediately hear the sound of the bustling coffee machine brewing the gorgeous coffee beans."],"terms":[{"term":"I'd love nothing more than to ...","vi":"tôi rất muốn ...; không gì khiến tôi thích hơn ...","category":"Speaking pattern","usage":"I’d love nothing more than to + verb","explain":"Mẫu nhấn mạnh mong muốn rất được làm việc gì."},{"term":"a vibrant atmosphere","vi":"bầu không khí sôi động, tràn đầy sức sống","category":"Collocation","usage":"a vibrant atmosphere","explain":"Mô tả không gian sống động, có năng lượng hoặc nhiều hoạt động."},{"term":"whenever I think of ...","vi":"bất cứ khi nào tôi nghĩ đến ...","category":"Grammar pattern","usage":"whenever + subject + verb","explain":"Dùng để nói việc gì thường xảy ra mỗi khi một điều kiện xuất hiện."},{"term":"immediately hear the sound of ...","vi":"ngay lập tức nghe thấy âm thanh của ...","category":"Sensory pattern","usage":"hear the sound of + noun / -ing","explain":"Giúp làm rõ âm thanh khi miêu tả một địa điểm."},{"term":"bustling coffee machine","vi":"máy pha cà phê đang hoạt động tấp nập","category":"Word choice","usage":"bustling + street / café / city","explain":"Bản gốc nói “bustling coffee machine”; với máy pha cà phê, “humming coffee machine” thường tự nhiên hơn."},{"term":"brewing the gorgeous coffee beans","vi":"pha chế từ những hạt cà phê tuyệt hảo","category":"Word choice","usage":"brew coffee from + coffee beans","explain":"Bản gốc giữ nguyên; cách nói thường gặp hơn là “brewing fresh coffee”."}],"extra":"master","highlight":[["I'd love nothing more than to",0],["vibrant atmosphere",1],["Whenever I think of",2],["immediately hear the sound of",3],["bustling coffee machine",4],["brewing the gorgeous coffee beans",5]],"translation":["Tôi rất muốn đến quán cà phê tuyệt đẹp gần nhà vì nơi đó có bầu không khí sôi động và thực sự rất đẹp.","Bất cứ khi nào nghĩ đến Highland Coffee, tôi lập tức nghe thấy âm thanh của máy pha cà phê đang hoạt động và pha chế những hạt cà phê tuyệt hảo."]},{"id":7,"title":"What's your favorite room in your home?","paragraphs":["When it comes to choosing favorite things, it usually holds a sentimental value to me. For example, the apartment I'm currently living, my favorite room is the kitchen because whenever I feel sad, I’d like to cook myself a good meal.","But in the house, back in my home town, my favorite room is the bedroom, because it's my childhood room and it's also carries a lot of memories for me and makes me feel safe."],"terms":[{"term":"when it comes to ...","vi":"khi nói đến ...","category":"Speaking pattern","usage":"when it comes to + noun / -ing","explain":"Dùng để chuyển vào chủ đề mình sắp trình bày."},{"term":"hold sentimental value to me","vi":"có giá trị tinh thần, tình cảm đối với tôi","category":"Collocation","usage":"have sentimental value for + someone","explain":"Bản gốc dùng “holds a sentimental value to me”; cách tự nhiên hơn: “has sentimental value for me”."},{"term":"cook myself a good meal","vi":"tự nấu cho mình một bữa ăn ngon","category":"Grammar pattern","usage":"cook someone a meal / cook a meal for someone","explain":"Cấu trúc động từ hai tân ngữ; myself là người được hưởng."},{"term":"back in my home town","vi":"ở quê nhà của tôi","category":"Useful chunk","usage":"back in + a place from your past","explain":"Back in nhắc đến địa điểm hoặc giai đoạn quá khứ."},{"term":"my childhood room","vi":"căn phòng gắn bó với tuổi thơ tôi","category":"Useful chunk","usage":"childhood + bedroom / home / memories","explain":"Chỉ đồ vật hoặc địa điểm gắn với tuổi thơ."},{"term":"carry a lot of memories","vi":"lưu giữ nhiều kỷ niệm","category":"Collocation","usage":"hold memories / bring back memories","explain":"Bài gốc dùng “carries a lot of memories”; “holds a lot of memories” tự nhiên hơn."},{"term":"make me feel safe","vi":"khiến tôi cảm thấy an toàn","category":"Grammar pattern","usage":"make + object + bare infinitive","explain":"Make me feel: sau make + tân ngữ dùng động từ nguyên mẫu không to."}],"extra":null,"highlight":[["When it comes to",0],["holds a sentimental value to me",1],["cook myself a good meal",2],["back in my home town",3],["childhood room",4],["carries a lot of memories",5],["makes me feel safe",6]],"translation":["Khi nói đến việc chọn những thứ yêu thích, chúng thường mang giá trị tình cảm đối với tôi. Chẳng hạn, tại căn hộ tôi đang sống hiện nay, căn phòng yêu thích của tôi là nhà bếp, bởi mỗi khi buồn, tôi lại muốn tự nấu cho mình một bữa ăn ngon.","Nhưng trong ngôi nhà ở quê, căn phòng yêu thích của tôi là phòng ngủ, vì đó là căn phòng thời thơ ấu và cũng lưu giữ nhiều kỷ niệm, khiến tôi cảm thấy an toàn."]},{"id":8,"title":"Do you like this coffee shop?","paragraphs":["Oh, absolutely. I'm always blown away by the warm greeting and the coffee aroma as you come in. Then I'm blown away by the smell of the fresh coffee beans, as well as the gentle hum of conversations."],"terms":[{"term":"be blown away by ...","vi":"vô cùng ấn tượng, choáng ngợp bởi ...","category":"Idiom","usage":"be blown away by + something","explain":"Chỉ cảm giác cực kỳ ấn tượng hoặc bất ngờ."},{"term":"a warm greeting","vi":"lời chào đón nồng nhiệt, ấm áp","category":"Collocation","usage":"a warm greeting / a warm welcome","explain":"Warm gợi sự chân thành, thân thiện khi được chào đón."},{"term":"coffee aroma","vi":"hương thơm cà phê","category":"Sensory description","usage":"the aroma of coffee / coffee aroma","explain":"Aroma diễn tả hương thơm, nhất là cà phê và đồ ăn."},{"term":"the smell of the fresh coffee beans","vi":"mùi hương của những hạt cà phê tươi","category":"Sensory phrase","usage":"the smell of + noun","explain":"Dùng khi nhắc đến một mùi cụ thể; fresh trong bài bổ nghĩa cho coffee beans."},{"term":"the gentle hum of conversations","vi":"tiếng trò chuyện rì rầm, nhẹ nhàng","category":"Collocation","usage":"the gentle hum of + conversations / voices","explain":"Hum mô tả âm thanh rì rầm, liên tục, không quá lớn."},{"term":"bright, engaging lighting","vi":"ánh sáng tươi sáng, thu hút","category":"Word choice","usage":"bright, inviting lighting","explain":"Bản gốc “bright, engaging lighting”; “inviting lighting” phù hợp hơn khi tả không gian dễ chịu."},{"term":"thick and creamy taste","vi":"hương vị đậm đà và béo ngậy","category":"Sensory description","usage":"thick, creamy texture / rich, creamy taste","explain":"Thick thường mô tả độ sánh, kết cấu; creamy mô tả độ béo mịn."}],"extra":"sensory","highlight":[["blown away by",0],["warm greeting",1],["coffee aroma",2],["smell of the fresh coffee beans",3],["gentle hum of conversations",4]],"translation":["Ồ, chắc chắn rồi. Tôi luôn vô cùng ấn tượng với lời chào đón ấm áp và hương cà phê khi bước vào quán. Sau đó, tôi lại bị cuốn hút bởi mùi hương của những hạt cà phê tươi, cùng với tiếng trò chuyện rì rầm, nhẹ nhàng."]}]</script>
<script>
'use strict';

const AUDIO_SEGMENTS=[{"start":0.0,"end":18.84},{"start":19.39,"end":47.75},{"start":48.3,"end":76.94},{"start":77.49,"end":102.89},{"start":103.44,"end":138.24},{"start":138.79,"end":162.91},{"start":163.46,"end":199.22},{"start":199.77,"end":217.81}];
const AUDIO_FILE='speaking_audio.mp3';
const audio=new Audio(AUDIO_FILE);
audio.preload='metadata';
audio.playsInline=true;
let audioTopic=-1, audioTicket=0, frameId=null, playbackSpeed=1;
const panelFor=i=>document.querySelector(`.audio-panel[data-audio-topic="${i}"]`);
function formatAudioTime(value){
 if(!Number.isFinite(value)||value<0)value=0;
 const sec=Math.floor(value);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}
function audioPlayer(topicId){
 const seg=AUDIO_SEGMENTS[topicId-1];
 if(!seg)return '';
 const duration=seg.end-seg.start;
 return `<div class="audio-panel" data-audio-topic="${topicId}" aria-label="Listen to speaking topic ${topicId}">
    <div class="audio-upper"><span class="audio-label">LISTEN · TOPIC ${String(topicId).padStart(2,'0')}</span><span class="audio-state" aria-live="polite">Ready</span></div>
    <div class="audio-actions"><button type="button" class="audio-btn primary" data-audio-play>▶ Play</button><button type="button" class="audio-btn" data-audio-stop>■ Stop</button></div>
    <input class="audio-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek within this speaking topic" />
    <div class="audio-bottom"><span class="audio-clock">0:00 / ${formatAudioTime(duration)}</span><label>Speed <select class="audio-speed" aria-label="Playback speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div>
   </div>`;
}
function paintPlayer(topicId){
 const panel=panelFor(topicId),seg=AUDIO_SEGMENTS[topicId-1];if(!panel||!seg)return;
 const activeHere=audioTopic===topicId-1;
 const local=activeHere?Math.max(0,Math.min(seg.end-seg.start,audio.currentTime-seg.start)):0;
 const prog=panel.querySelector('.audio-progress');
 if(document.activeElement!==prog)prog.value=String(Math.round(1000*local/(seg.end-seg.start)));
 panel.querySelector('.audio-clock').textContent=`${formatAudioTime(local)} / ${formatAudioTime(seg.end-seg.start)}`;
 const playing=activeHere&&!audio.paused;
 panel.querySelector('[data-audio-play]').textContent=playing?'❚❚ Pause':(local>0?'▶ Resume':'▶ Play');
 panel.querySelector('.audio-state').textContent=playing?'Playing':(local>0?'Paused':'Ready');
 panel.closest('.topic-content')?.classList.toggle('audio-speaking',playing);
}
function clearAudioFrame(){if(frameId!==null)cancelAnimationFrame(frameId);frameId=null;}
function stopTopicAudio(){
 audioTicket++;clearAudioFrame();const old=audioTopic;audio.pause();audioTopic=-1;
 if(old>=0){paintPlayer(old+1);panelFor(old+1)?.closest('.topic-content')?.classList.remove('audio-speaking');}
}
function audioTicker(){
 frameId=null;if(audioTopic<0||audio.paused)return;
 const seg=AUDIO_SEGMENTS[audioTopic];
 if(!seg||audio.currentTime>=seg.end-.045){stopTopicAudio();return;}
 paintPlayer(audioTopic+1);frameId=requestAnimationFrame(audioTicker);
}
async function toggleTopicAudio(topicId){
 const idx=topicId-1,seg=AUDIO_SEGMENTS[idx];if(!seg)return;
 if(audioTopic===idx&&!audio.paused){audio.pause();audioTicket++;clearAudioFrame();paintPlayer(topicId);return;}
 if(audioTopic!==idx){stopTopicAudio();audioTopic=idx;audio.currentTime=seg.start+.015;}
 if(audio.currentTime>=seg.end-.1)audio.currentTime=seg.start+.015;
 audio.playbackRate=playbackSpeed;
 const ticket=++audioTicket;
 try{await audio.play();if(ticket!==audioTicket||audioTopic!==idx){audio.pause();return;}
  clearAudioFrame();audioTicker();paintPlayer(topicId);
 }catch(err){if(ticket===audioTicket){const p=panelFor(topicId);if(p)p.querySelector('.audio-state').textContent='Playback unavailable';}}
}
function wireAudioPanel(section,topicId){
 if(!AUDIO_SEGMENTS[topicId-1])return;
 const panel=section.querySelector('.audio-panel');
 panel.querySelector('[data-audio-play]').addEventListener('click',()=>toggleTopicAudio(topicId));
 panel.querySelector('[data-audio-stop]').addEventListener('click',stopTopicAudio);
 panel.querySelector('.audio-progress').addEventListener('input',e=>{
  const seg=AUDIO_SEGMENTS[topicId-1],pct=Number(e.target.value)/1000;
  if(audioTopic!==topicId-1){stopTopicAudio();audioTopic=topicId-1;}
  audio.currentTime=seg.start+Math.max(.015,Math.min(pct*(seg.end-seg.start),seg.end-seg.start-.055));
  paintPlayer(topicId);
 });
 panel.querySelector('.audio-progress').addEventListener('change',()=>paintPlayer(topicId));
 panel.querySelector('.audio-speed').addEventListener('change',e=>{
  playbackSpeed=Number(e.target.value);audio.playbackRate=playbackSpeed;
  document.querySelectorAll('.audio-speed').forEach(s=>{s.value=String(playbackSpeed)});
 });
}
audio.addEventListener('timeupdate',()=>{if(audioTopic>=0){
 const seg=AUDIO_SEGMENTS[audioTopic];if(!seg||audio.currentTime>=seg.end-.045)stopTopicAudio();else paintPlayer(audioTopic+1);
}});
audio.addEventListener('ended',stopTopicAudio);
audio.addEventListener('error',()=>{
 if(audioTopic>=0){const p=panelFor(audioTopic+1);if(p)p.querySelector('.audio-state').textContent='Audio file missing';}
 stopTopicAudio();
});

const TOPICS=JSON.parse(document.getElementById('speaking-data').textContent);
let active=0, globalVi=false, highlights=true, selected=null;
const $=id=>document.getElementById(id);
const escapeHTML=str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum=i=>String(i).padStart(2,'0');
const prefReduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function highlightText(text,topic){
  // Select non-overlapping literal phrases: no original word or punctuation is rewritten.
  const found=[];
  topic.highlight.forEach(([pattern,idx])=>{
    const hay=text.toLowerCase(),needle=pattern.toLowerCase();
    let pos=hay.indexOf(needle);
    while(pos!==-1){found.push({start:pos,end:pos+pattern.length,idx,len:pattern.length});pos=hay.indexOf(needle,pos+needle.length);}
  });
  found.sort((a,b)=>b.len-a.len||a.start-b.start);
  let chosen=[];
  found.forEach(m=>{if(!chosen.some(a=>a.start<m.end&&m.start<a.end)){chosen.push(m);}});
  chosen.sort((a,b)=>a.start-b.start);
  let pos=0,s='';
  for(const f of chosen){s+=escapeHTML(text.slice(pos,f.start));s+=`<span class="inline-term" role="button" tabindex="0" data-note="${f.idx}" aria-label="Explain: ${escapeHTML(text.slice(f.start,f.end))}">${escapeHTML(text.slice(f.start,f.end))}</span>`;pos=f.end;}
  s+=escapeHTML(text.slice(pos));return s;
}
function buildTopic(topic){
 const container=document.createElement('section');container.className='topic-content';container.id=`topic-${toNum(topic.id)}`;container.dataset.topic=topic.id;container.hidden=true;
 const paragraphs=topic.paragraphs.map((t,i)=>`<div class="script-pair"><p class="text-paragraph">${highlightText(t,topic)}</p><p class="full-vi" lang="vi">${escapeHTML(topic.translation[i])}</p></div>`).join('');
 let extra='';
 if(topic.extra==='master')extra=`<div class="master"><h3>Master phrase</h3><strong>Whenever I think of X, I can immediately hear the sound of Y.</strong></div>`;
 if(topic.extra==='sensory')extra=`<div class="sensory"><h3>Describing a place through the senses</h3><div class="sensory-list"><div><b>1. Sight:</b> bright, engaging lighting</div><div><b>2. Sound:</b> beautiful sound of the coffee machine; the gentle hum of conversations.</div><div><b>3. Taste:</b> Thick and creamy taste</div></div>`;
 const glossary=topic.terms.map((t,i)=>`<div class="note-item" data-note-index="${i}"><div class="note-number">${i+1}</div><div><div class="note-top"><div class="note-en">${escapeHTML(t.term)}</div><span class="cat">${escapeHTML(t.category)}</span></div><p class="usage"><span>Pattern / use:</span> ${escapeHTML(t.usage)}</p><button class="note-open" type="button" aria-expanded="false">Show meaning &amp; notes ↓</button><div class="vi-box" hidden><strong>${escapeHTML(t.vi)}</strong><span class="expl">${escapeHTML(t.explain)}</span></div></div></div>`).join('');
 container.innerHTML=`<div class="section-top"><span class="unitline">IELTS SPEAKING · <b>TOPIC ${toNum(topic.id)}</b> / ${toNum(TOPICS.length)}</span></div><div class="titlebox"><span class="big-num">${toNum(topic.id)}</span><h2>${escapeHTML(topic.title)}</h2></div>${audioPlayer(topic.id)}<div class="scriptlabel">Original speaking script</div><div class="script">${paragraphs}</div>${extra}<div class="notes" id="notes-${topic.id}"><div class="notes-head"><div><small>MEANING · USAGE · STRUCTURE</small><h3>Collocation Notes</h3></div><span class="count">${topic.terms.length} expressions · numbered 1–${topic.terms.length}</span></div><div class="note-list">${glossary}</div></div>`;
 wireAudioPanel(container,topic.id);
 container.addEventListener('keydown',evt=>{const hot=evt.target.closest('.inline-term');if(hot&&(evt.key==='Enter'||evt.key===' ')){evt.preventDefault();revealOne(container,Number(hot.dataset.note),true);}});
 container.addEventListener('click',evt=>{
   const hot=evt.target.closest('.inline-term');
   if(hot){const idx=Number(hot.dataset.note);revealOne(container,idx,true);return;}
   const toggler=evt.target.closest('.note-open');if(toggler){let row=toggler.closest('.note-item');toggleRow(row,!row.classList.contains('expanded'));}
 });
 return container;
}
function toggleRow(row,expand){row.classList.toggle('expanded',expand);const btn=row.querySelector('.note-open'), vi=row.querySelector('.vi-box');vi.hidden=!(globalVi||expand);btn.setAttribute('aria-expanded',String(expand));btn.textContent=expand?'Hide meaning & notes ↑':'Show meaning & notes ↓';}
function revealOne(section,idx,scroll){
 section.querySelectorAll('.note-item').forEach(r=>r.classList.remove('selected-note'));
 section.querySelectorAll('.inline-term').forEach(r=>r.classList.toggle('picked',Number(r.dataset.note)===idx));
 const row=section.querySelector(`.note-item[data-note-index="${idx}"]`);
 if(!row)return;row.classList.add('selected-note');toggleRow(row,true);selected=idx;
 if(scroll)row.scrollIntoView({behavior:prefReduced?'auto':'smooth',block:'center'});
}
function go(index){
 stopTopicAudio();
 active=Math.max(0,Math.min(TOPICS.length-1,index));
 document.querySelectorAll('.topic-content').forEach((s,i)=>{s.hidden=i!==active;});
 document.querySelectorAll('.topic-jump').forEach((b,i)=>b.setAttribute('aria-current',String(i===active)));
 $('topic-select').value=String(active);$('prev').disabled=active===0;$('next').disabled=active===TOPICS.length-1;
 $('progress').innerHTML=`${toNum(active+1)} / ${toNum(TOPICS.length)} <small>TOPICS</small>`;
 selected=null;
 window.scrollTo({top:0,behavior:prefReduced?'auto':'instant'});
}
function init(){
 const nav=$('topic-list'), select=$('topic-select'), content=$('content');
 TOPICS.forEach((topic,i)=>{
  const button=document.createElement('button');button.type='button';button.className='topic-jump';button.setAttribute('aria-current','false');button.innerHTML=`<span class="topic-num">${toNum(topic.id)}</span><span>${escapeHTML(topic.title)}</span>`;button.addEventListener('click',()=>go(i));nav.appendChild(button);
  const option=document.createElement('option');option.value=String(i);option.textContent=`${toNum(topic.id)} — ${topic.title}`;select.appendChild(option);
  content.appendChild(buildTopic(topic));
 });
 select.addEventListener('change',evt=>go(Number(evt.target.value)));
 $('prev').addEventListener('click',()=>go(active-1));$('next').addEventListener('click',()=>go(active+1));
 $('toggle-highlight').addEventListener('click',()=>{
   highlights=!highlights;document.body.classList.toggle('no-highlights',!highlights);
   $('toggle-highlight').classList.toggle('on',highlights);$('toggle-highlight').setAttribute('aria-pressed',String(highlights));$('toggle-highlight').innerHTML=`<span class="dot"></span> Highlight ${highlights?'ON':'OFF'}`;
 });
 $('toggle-vi').addEventListener('click',()=>{
   globalVi=!globalVi;
   document.body.classList.toggle('vi-on',globalVi);
   document.querySelectorAll('.note-item').forEach(row=>{row.querySelector('.vi-box').hidden=!(globalVi||row.classList.contains('expanded'));});
   $('toggle-vi').classList.toggle('on',globalVi);$('toggle-vi').setAttribute('aria-pressed',String(globalVi));$('toggle-vi').innerHTML=`<span class="dot"></span> Vietnamese ${globalVi?'ON':'OFF'}`;
 });
 go(0);
}
init();
</script>
</body></html>
